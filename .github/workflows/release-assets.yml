name: Release assets
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  assets:
    if: ${{ !github.event.release.prerelease && startsWith(github.event.release.tag_name, '0.2.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build verified release artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/package_release.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-assets"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release-assets/"*
